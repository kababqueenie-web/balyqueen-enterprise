<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Balyqueen Enterprise</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      👑 BALYQUEEN
    </div>

    <button
      class="cart-button"
      onclick="openCart()"
    >
      🛒 Cart
      <span id="cartCount">0</span>
    </button>

  </header>


  <!-- HERO -->

  <section class="hero">

    <h1>
      Welcome to Balyqueen Enterprise 👑
    </h1>

    <p>
      Quality products at affordable prices.
    </p>

    <p class="motto">
      WE SELL QUALITY, NOT QUANTITY 💕
    </p>

  </section>


  <!-- SEARCH -->

  <section class="search-section">

    <input
      type="search"
      id="search"
      placeholder="🔍 Search products..."
      oninput="filterProducts()"
    >

    <select
      id="category"
      onchange="filterProducts()"
    >

      <option value="all">
        All Categories
      </option>

      <option value="Clothes">
        Clothes
      </option>

      <option value="Abaya">
        Abaya
      </option>

      <option value="Jalab">
        Jalab
      </option>

      <option value="Shoes">
        Shoes
      </option>

      <option value="Bags">
        Bags
      </option>

      <option value="Watches">
        Watches
      </option>

      <option value="Jewelry">
        Jewelry
      </option>

      <option value="Beauty">
        Beauty
      </option>

      <option value="Gadgets">
        Gadgets
      </option>

      <option value="Kitchen & Home">
        Kitchen & Home
      </option>

      <option value="Room Decor">
        Room Decor
      </option>

      <option value="Surprise Packages">
        Surprise Packages
      </option>

    </select>

  </section>


  <!-- PRODUCTS -->

  <main>

    <h2>
      Our Products 🛍️
    </h2>

    <div
      id="products"
      class="products"
    >

      <p class="loading">
        Loading products...
      </p>

    </div>

  </main>


  <!-- CART -->

  <div
    id="cartModal"
    class="modal"
  >

    <div class="cart-box">

      <button
        class="close"
        onclick="closeCart()"
      >
        ✕
      </button>

      <h2>
        Your Cart 🛒
      </h2>

      <div id="cartItems"></div>

      <div class="cart-total">

        Total:

        <strong>
          ₦<span id="cartTotal">0</span>
        </strong>

      </div>

      <button
        class="checkout-button"
        onclick="checkout()"
      >
        Proceed to Checkout
      </button>

    </div>

  </div>


  <!-- CHECKOUT -->

  <div
    id="checkoutModal"
    class="modal"
  >

    <div class="cart-box">

      <button
        class="close"
        onclick="closeCheckout()"
      >
        ✕
      </button>

      <h2>
        Checkout 💳
      </h2>

      <input
        type="email"
        id="customerEmail"
        placeholder="Your email address"
        required
      >

      <input
        type="text"
        id="customerName"
        placeholder="Full name"
        required
      >

      <input
        type="tel"
        id="customerPhone"
        placeholder="Phone number"
        required
      >

      <textarea
        id="customerAddress"
        placeholder="Delivery address"
      ></textarea>

      <button
        class="checkout-button"
        onclick="payNow()"
      >
        Pay Now
      </button>

    </div>

  </div>


  <footer>

    <p>
      © 2026 Balyqueen Enterprise
    </p>

    <p>
      Quality products. Affordable prices. 👑
    </p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
